<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

const merge = BGU.mergeGeometries;
const TAU = Math.PI * 2;

/* ===================== helpers ===================== */
const rngF = (s) => () => { s |= 0; s = (s + 0x6d2b79f5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rand = rngF(1020);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function glowTex(inner = 'rgba(255,255,255,1)', mid = 'rgba(255,255,255,0.35)') {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, inner); gr.addColorStop(0.35, mid); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function petalTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'); g.translate(32, 32); g.rotate(-0.6);
  const gr = g.createRadialGradient(0, 0, 2, 0, 0, 26);
  gr.addColorStop(0, '#fff1f5'); gr.addColorStop(0.6, '#f9a8c4'); gr.addColorStop(1, 'rgba(249,168,196,0)');
  g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 24, 13, 0, 0, TAU); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function cloudTex() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96; const g = c.getContext('2d'); const r = rngF(7);
  for (let i = 0; i < 16; i++) { const x = 30 + r() * 196, y = 30 + r() * 36, rad = 22 + r() * 30;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(255,255,255,0.55)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 256, 96); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function paint(geo, color, shade = 1) {
  const c = new THREE.Color(color); const n = geo.attributes.position.count; const a = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { a[i * 3] = c.r * shade; a[i * 3 + 1] = c.g * shade; a[i * 3 + 2] = c.b * shade; }
  geo.setAttribute('color', new THREE.BufferAttribute(a, 3)); return geo;
}
function petal({ sx, sy, sz, tilt, yaw, r, y, color, shade }) {
  const g = new THREE.SphereGeometry(1, 6, 4); g.scale(sx, sy, sz); g.translate(0, sy * 0.9, 0);
  g.rotateX(tilt); g.translate(0, 0, r); g.rotateY(yaw); g.translate(0, y, 0); return paint(g, color, shade);
}
function roseHead() {
  const p = [];
  [[4, .018, .1, .034, .06, 0, .6], [5, .04, .32, .05, .07, -.004, .75], [6, .068, .58, .062, .074, -.014, .88], [7, .096, .88, .066, .07, -.03, 1]]
    .forEach(([n, r, tilt, sx, sy, y, sh], ri) => { for (let i = 0; i < n; i++) p.push(petal({ sx, sy, sz: .016, tilt, yaw: i / n * TAU + ri * .45, r, y, color: 0xffffff, shade: sh })); });
  const b = new THREE.SphereGeometry(.03, 6, 4); b.translate(0, .03, 0); p.push(paint(b, 0xffffff, .5)); return merge(p);
}
function tulipHead() {
  const p = [];
  for (let i = 0; i < 3; i++) {
    p.push(petal({ sx: .036, sy: .085, sz: .017, tilt: .2, yaw: i / 3 * TAU, r: .024, y: 0, color: 0xffffff, shade: .95 }));
    p.push(petal({ sx: .034, sy: .078, sz: .016, tilt: .1, yaw: i / 3 * TAU + Math.PI / 3, r: .018, y: .005, color: 0xffffff, shade: .8 }));
  }
  return merge(p);
}
function daisyHead() {
  const p = [];
  for (let i = 0; i < 13; i++) { const g = new THREE.SphereGeometry(1, 5, 3); g.scale(.017, .0035, .075); g.translate(0, 0, .085); g.rotateX(-.14); g.rotateY(i / 13 * TAU); p.push(paint(g, 0xffffff, .98)); }
  const c = new THREE.SphereGeometry(.036, 7, 5); c.scale(1, .55, 1); c.translate(0, .008, 0); p.push(paint(c, 0xf4b400, 1)); return merge(p);
}
function lavHead() {
  const p = [], a = new THREE.Color(0x7c3aed), b = new THREE.Color(0xc4b5fd);
  for (let i = 0; i < 22; i++) { const t = i / 21, rad = .05 * (1 - t * .75), ang = i * 2.4;
    const g = new THREE.SphereGeometry(.022 * (1 - t * .4), 5, 4); g.translate(Math.cos(ang) * rad, .02 + t * .26, Math.sin(ang) * rad);
    p.push(paint(g, a.clone().lerp(b, t), 1)); }
  return merge(p);
}
function stemGeo(h, leaves = true) {
  const p = []; const s = new THREE.CylinderGeometry(.007, .011, h, 5); s.translate(0, h / 2, 0); p.push(paint(s, 0x2f6d2b, 1));
  const c = new THREE.ConeGeometry(.02, .05, 6); c.translate(0, h - .01, 0); p.push(paint(c, 0x3b7d33, 1));
  if (leaves) for (let i = 0; i < 3; i++) p.push(petal({ sx: .03, sy: .15, sz: .007, tilt: .9 + i * .1, yaw: i * 2.1 + .5, r: 0, y: h * (.18 + i * .16), color: 0x3f8a36, shade: .9 }));
  return merge(p);
}
function bladeGeo() {
  const g = new THREE.PlaneGeometry(1, 1, 1, 3), p = g.attributes.position, cols = new Float32Array(p.count * 3);
  const root = new THREE.Color(0x163a17), tip = new THREE.Color(0xa8d860), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const y = p.getY(i) + .5, x = p.getX(i); p.setXYZ(i, x * .09 * (1 - .9 * y), y * .6, y * y * .12);
    c.copy(root).lerp(tip, y); cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b; }
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3)); g.computeVertexNormals(); return g;
}
const timeU = { value: 0 };
function windify(mat, amp) {
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = timeU; sh.uniforms.uAmp = { value: amp };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nuniform float uTime;\nuniform float uAmp;')
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        #ifdef USE_INSTANCING
          vec3 iP = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
        #else
          vec3 iP = vec3(0.0);
        #endif
        float sw = pow(max(position.y, 0.0), 1.5) * uAmp;
        transformed.x += sin(uTime * 1.6 + iP.x * 0.35 + iP.z * 0.27) * sw;
        transformed.z += cos(uTime * 1.2 + iP.z * 0.31 + iP.x * 0.22) * sw * 0.7;`);
  };
  return mat;
}
function taperedTube(curve, tubular, r0, r1, radial) {
  const g = new THREE.TubeGeometry(curve, tubular, 1, radial, false), pos = g.attributes.position;
  for (let j = 0; j <= tubular; j++) { const u = j / tubular, c = curve.getPointAt(u), r = r0 + (r1 - r0) * u;
    for (let k = 0; k <= radial; k++) { const i = j * (radial + 1) + k;
      pos.setXYZ(i, c.x + (pos.getX(i) - c.x) * r, c.y + (pos.getY(i) - c.y) * r, c.z + (pos.getZ(i) - c.z) * r); } }
  g.computeVertexNormals(); return g;
}

/* ===================== renderer / scene ===================== */
const lowPower = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent);
const Q = lowPower ? 0.5 : 1;
const app = document.getElementById('app');
const W = () => window.innerWidth, H = () => window.innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: !lowPower, powerPreference: 'high-performance' });
const pr = Math.min(window.devicePixelRatio || 1, lowPower ? 1.5 : 2);
renderer.setPixelRatio(pr); renderer.setSize(W(), H());
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xe6a08f, 0.0095);
const camera = new THREE.PerspectiveCamera(42, W() / H(), 0.1, 1500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.06; controls.minDistance = 2.5; controls.maxDistance = 45;
controls.maxPolarAngle = Math.PI / 2 - 0.05; controls.autoRotateSpeed = 1.1;

/* sky */
const sunDir = new THREE.Vector3(-0.6, 0.26, -0.75).normalize();
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  uniforms: { top: { value: new THREE.Color(0x2a1650) }, mid: { value: new THREE.Color(0xb85c8a) }, hor: { value: new THREE.Color(0xffb48a) }, sunDir: { value: sunDir } },
  vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 top; uniform vec3 mid; uniform vec3 hor; uniform vec3 sunDir; varying vec3 vDir;
    void main(){ vec3 d = normalize(vDir); float h = d.y;
      vec3 col = mix(hor, mid, smoothstep(0.0, 0.28, h)); col = mix(col, top, smoothstep(0.2, 0.85, h));
      col = mix(hor * 0.75, col, smoothstep(-0.2, 0.02, h));
      float s = max(dot(d, sunDir), 0.0);
      col += vec3(1.0, 0.72, 0.45) * pow(s, 8.0) * 0.45; col += vec3(1.0, 0.86, 0.62) * pow(s, 220.0) * 3.0;
      gl_FragColor = vec4(col, 1.0); }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 16), skyMat); sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);
const cTex = cloudTex();
for (let i = 0; i < 14; i++) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: cTex, color: 0xffc6b4, transparent: true, opacity: .32, depthWrite: false, depthTest: false, fog: false }));
  const a = rand() * TAU, el = .12 + rand() * .22;
  sp.position.set(Math.cos(a) * Math.cos(el) * 480, Math.sin(el) * 480, Math.sin(a) * Math.cos(el) * 480);
  sp.scale.set(240 + rand() * 160, 60 + rand() * 40, 1); sp.renderOrder = -9; sky.add(sp);
}
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new THREE.Scene(); envScene.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), skyMat.clone()));
const envTex = pmrem.fromScene(envScene, 0.02).texture;

/* lights */
scene.add(new THREE.HemisphereLight(0xffb7c5, 0x2a3a22, 1.0));
const sun = new THREE.DirectionalLight(0xffc890, 2.8);
sun.castShadow = true; sun.shadow.mapSize.set(lowPower ? 1024 : 2048, lowPower ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 140 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
sun.position.copy(sunDir).multiplyScalar(70); sun.target.position.set(0, 0, 4);
scene.add(sun, sun.target);
const fill = new THREE.DirectionalLight(0x8a6cff, 0.45); fill.position.set(40, 20, 50); scene.add(fill);

/* ===================== materials ===================== */
const pearl = new THREE.MeshPhysicalMaterial({ color: 0xfffdf9, roughness: 0.34, clearcoat: 0.85, clearcoatRoughness: 0.18, sheen: 1, sheenColor: new THREE.Color(0xffd6e4), envMap: envTex, envMapIntensity: 0.9 });
const horseMat = new THREE.MeshPhysicalMaterial({ color: 0xfcfaf6, roughness: 0.55, sheen: 0.8, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xffe3ee), envMap: envTex, envMapIntensity: 0.55 });
const maneMat = new THREE.MeshStandardMaterial({ color: 0xfff5fa, roughness: 0.6, emissive: 0x6a3a50, emissiveIntensity: 0.12 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xe0b25e, metalness: 0.95, roughness: 0.25, envMap: envTex, envMapIntensity: 1.3 });
const dark = new THREE.MeshStandardMaterial({ color: 0x15101a, roughness: 0.2 });
const pinkPad = new THREE.MeshStandardMaterial({ color: 0xf6bfd0, roughness: 0.7 });
const roseMats = [0xe11d48, 0xfb7185, 0xfda4af, 0xfff1f2].map((c) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.55 }));
const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f8a36, roughness: 0.8 });

/* ===================== LOFT (thân hình liền mạch) ===================== */
const S = (y, z, rx, ry, x = 0) => ({ p: [x, y, z], rx, ry });
function loft(st, radial = 20, ref = new THREE.Vector3(0, 1, 0)) {
  const n = st.length, pts = st.map((s) => new THREE.Vector3(s.p[0], s.p[1], s.p[2]));
  const pos = [], idx = [];
  const T = new THREE.Vector3(), N = new THREE.Vector3(), B = new THREE.Vector3();
  for (let i = 0; i < n; i++) {
    T.copy(pts[Math.min(n - 1, i + 1)]).sub(pts[Math.max(0, i - 1)]).normalize();
    N.crossVectors(T, ref).normalize(); B.crossVectors(T, N).normalize();
    for (let k = 0; k <= radial; k++) {
      const th = k / radial * TAU, cx = Math.cos(th) * st[i].rx, sy = Math.sin(th) * st[i].ry;
      pos.push(pts[i].x + N.x * cx + B.x * sy, pts[i].y + N.y * cx + B.y * sy, pts[i].z + N.z * cx + B.z * sy);
    }
  }
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < radial; k++) {
    const a = i * (radial + 1) + k, b = a + 1, c = a + radial + 1, d = c + 1; idx.push(a, b, c, b, d, c);
  }
  let g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  g = BGU.mergeVertices(g, 1e-4); g.computeVertexNormals(); return g;
}

/* lông vũ / chùm lông */
const featherShape = new THREE.Shape();
featherShape.moveTo(0, 0); featherShape.bezierCurveTo(.12, .075, .34, .07, 1, 0); featherShape.bezierCurveTo(.34, -.05, .12, -.045, 0, 0);
const featherGeo = new THREE.ShapeGeometry(featherShape, 8);
function makePlume(len = .55) {
  const g = new THREE.Group(); const cols = [0xffffff, 0xffe4ee, 0xffffff, 0xffd0e0, 0xfff3f8];
  for (let i = 0; i < 5; i++) {
    const m = new THREE.Mesh(featherGeo, new THREE.MeshStandardMaterial({ color: cols[i], roughness: .6, emissive: 0xffc8dc, emissiveIntensity: .14, side: THREE.DoubleSide }));
    m.scale.set(len * (1 - Math.abs(i - 2) * .06), 1.8, 1);
    m.rotation.set((i - 2) * .1, (i - 2) * .55, Math.PI / 2 + (i - 2) * .17); g.add(m);
  }
  return g;
}
function makeHeartGeo(depth = .06, bevel = .025) {
  const pts = [];
  for (let i = 0; i <= 64; i++) { const t = i / 64 * TAU; pts.push(new THREE.Vector2(16 * Math.pow(Math.sin(t), 3) / 32, (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 32)); }
  const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 5, curveSegments: 16 });
  g.center(); return g;
}

/* ===================== NGỰA TRẮNG (giải phẫu thật hơn) ===================== */
const sph = new THREE.SphereGeometry(1, 28, 20);
const crimson = new THREE.MeshStandardMaterial({ color: 0x9b1b3f, roughness: .85 });
let HG = null;
function horseGeos() {
  if (HG) return HG;
  const Z = new THREE.Vector3(0, 0, 1);
  const torso = loft([S(1.3, -1.0, .03, .05), S(1.3, -.94, .17, .24), S(1.32, -.78, .30, .36), S(1.32, -.45, .31, .37), S(1.28, -.1, .31, .385), S(1.28, .25, .31, .39), S(1.31, .55, .31, .40), S(1.27, .82, .24, .36), S(1.24, .97, .12, .24), S(1.22, 1.01, .02, .05)], 26);
  const neckSt = [S(1.55, .62, .15, .25), S(1.76, .8, .13, .21), S(2.0, .98, .115, .17), S(2.2, 1.12, .1, .14), S(2.3, 1.19, .09, .12)];
  const neck = loft(neckSt, 22);
  const hd = new THREE.Vector3(0, -.6, .8).normalize();
  const headSt = [[0, .09, .12], [.1, .1, .15], [.22, .105, .165], [.34, .072, .115], [.46, .07, .095], [.56, .076, .09], [.62, .062, .072], [.645, .012, .012]]
    .map(([s, rx, ry]) => ({ p: [hd.x * s, hd.y * s, hd.z * s], rx, ry }));
  const head = loft(headSt, 20);
  const fu = loft([S(.02, 0, .03, .03), S(0, 0, .13, .16), S(-.15, 0, .11, .13), S(-.4, 0, .075, .085), S(-.62, 0, .06, .065), S(-.64, 0, .03, .03)], 18, Z);
  const hu = loft([S(.02, 0, .03, .03), S(0, 0, .17, .22), S(-.2, -.05, .15, .19), S(-.45, -.1, .09, .12), S(-.62, -.12, .065, .08), S(-.64, -.12, .03, .03)], 18, Z);
  const low = loft([S(0, 0, .045, .05), S(-.04, 0, .06, .065), S(-.3, 0, .042, .048), S(-.42, 0, .05, .058), S(-.47, 0, .06, .066), S(-.55, .035, .045, .05), S(-.57, .04, .066, .076), S(-.66, .075, .082, .096), S(-.665, .075, .02, .02)], 16, Z);
  HG = { torso, neck, neckSt, head, hd, fu, hu, low }; return HG;
}
function makeHorse() {
  const G = horseGeos();
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const add = (geo, mat = horseMat, parent = body) => { const m = new THREE.Mesh(geo, mat); m.castShadow = true; parent.add(m); return m; };
  const ell = (sx, sy, sz, x, y, z, mat = horseMat, parent = body) => { const m = add(sph, mat, parent); m.scale.set(sx, sy, sz); m.position.set(x, y, z); return m; };

  add(G.torso); add(G.neck);
  [-1, 1].forEach((s) => { ell(.10, .21, .24, s * .27, 1.3, .5); ell(.12, .24, .27, s * .27, 1.3, -.7); });
  const neckCurve = new THREE.CatmullRomCurve3(G.neckSt.map((s) => new THREE.Vector3(...s.p)));

  // đầu
  const headPivot = new THREE.Group(); headPivot.position.set(0, 2.3, 1.19); body.add(headPivot);
  add(G.head, horseMat, headPivot);

  carriage.body.position.y = Math.sin(el * 9 * m) * .012 * m + Math.sin(el * 3.1) * .01;
  carriage.body.rotation.z = Math.sin(el * 2.2) * .006; carriage.body.rotation.x = Math.sin(el * 2.6) * .006;
  carriage.plumes.forEach((pl, k) => { pl.rotation.x = -.3 + Math.sin(el * 3 + k) * .1 * (.4 + m * .6); pl.rotation.z = Math.sin(el * 2.4 + k * 1.3) * .12; });
  carriage.orbs.forEach(({ m: o, o: off }) => o.scale.setScalar(.8 + Math.sin(el * 3.4 + off * .9) * .35));

  // hạt
  for (let i = 0; i < PET; i++) { petPos[i * 3 + 1] -= petVel[i * 2] * dt * 1.2; petPos[i * 3 + 2] -= V * dt; petPos[i * 3] += Math.sin(el * .9 + petVel[i * 2 + 1]) * dt * .5;
    if (petPos[i * 3 + 1] < .1 || petPos[i * 3 + 2] < -16) rePet(i, false), petPos[i * 3 + 2] = 14 + rand() * 12; }
  petGeo.attributes.position.needsUpdate = true;
  spawnAcc += dt * 70 * Math.max(.2, m);
  while (spawnAcc >= 1) { spawnAcc -= 1; const i = trHead; trHead = (trHead + 1) % TR;
    trPos[i * 3] = (rand() - .5) * 3.4; trPos[i * 3 + 1] = .15 + rand() * .6; trPos[i * 3 + 2] = -2.7 - rand() * .4;
    trVel[i * 3] = (rand() - .5) * .6; trVel[i * 3 + 1] = .3 + rand() * .7; trVel[i * 3 + 2] = -V * (.6 + rand() * .5); trLife[i] = 1;
    const c = trPal[Math.floor(rand() * trPal.length)]; trBase[i * 3] = c.r; trBase[i * 3 + 1] = c.g; trBase[i * 3 + 2] = c.b; }
  for (let i = 0; i < TR; i++) { if (trLife[i] > 0) { trLife[i] -= dt * .7; trPos[i * 3] += trVel[i * 3] * dt; trPos[i * 3 + 1] += trVel[i * 3 + 1] * dt; trPos[i * 3 + 2] += trVel[i * 3 + 2] * dt; const f = Math.max(0, trLife[i]); trCol[i * 3] = trBase[i * 3] * f; trCol[i * 3 + 1] = trBase[i * 3 + 1] * f; trCol[i * 3 + 2] = trBase[i * 3 + 2] * f; } else { trCol[i * 3] = trCol[i * 3 + 1] = trCol[i * 3 + 2] = 0; } }
  trGeo.attributes.position.needsUpdate = true; trGeo.attributes.color.needsUpdate = true;

  if (trans) { const k = Math.min(1, (now - trans.t0) / 1300), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(trans.a, vA.set(...trans.v.c), e); controls.target.lerpVectors(trans.b, vB.set(...trans.v.t), e); if (k >= 1) trans = null; }
  controls.update(); sky.position.copy(camera.position);
  composer.render(); requestAnimationFrame(loop);
}
loop();

window.addEventListener('resize', () => { camera.aspect = W() / H(); camera.updateProjectionMatrix(); renderer.setSize(W(), H()); composer.setSize(W(), H()); bloom.setSize(W(), H()); });
</script>
